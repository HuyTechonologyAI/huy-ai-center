name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'agent-task/06k-b1-codex-hardening'
      - 'security/**'
      - 'hotfix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # 1. CORE QUALITY GATE (BLOCKING — SELF-CONTAINED HUY AI CENTER)
  # ============================================================================
  quality-gate:
    needs: db-integration
    name: Quality Gate
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal shared packages
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Core Self-Contained Tests
        run: npm run test:core

      - name: Run Bridge Automation Tests
        run: npm run test:bridge

      - name: Run Multi-Org Security Tests (Static Invariant Mode)
        run: npm run test:security

  # ============================================================================
  # 2. LEGACY LINT AUDIT (NON-BLOCKING DIAGNOSTIC)
  # ============================================================================
  legacy-lint-audit:
    name: Legacy Lint Audit (Diagnostic Only)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal shared packages
        run: npm run build:shared

      - name: Legacy Lint (non-blocking)
        run: npm run lint || true
        continue-on-error: true

  # ============================================================================
  # 3. CROSS-REPOSITORY PORTFOLIO CONTRACT AUDIT (NON-BLOCKING DIAGNOSTIC)
  # ============================================================================
  portfolio-contract-audit:
    name: Portfolio Contract Audit (Diagnostic Only)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout huy-ai-center
        uses: actions/checkout@v4
        with:
          path: huy-ai-center

      - name: Checkout edtech-ai-portfolio (Sibling)
        uses: actions/checkout@v4
        with:
          repository: HuyTechonologyAI/edtech-ai-portfolio
          path: edtech-ai-portfolio
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: huy-ai-center/package-lock.json

      - name: Install dependencies
        working-directory: huy-ai-center
        run: npm ci

      - name: Build internal shared packages
        working-directory: huy-ai-center
        run: npm run build:shared

      - name: Run Portfolio Contract Tests
        working-directory: huy-ai-center
        run: npm run test:portfolio-contract
        continue-on-error: true

  db-integration:
    name: 06K-B Isolated DB Integration
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      REQUIRE_06K_B_DB: 'true'
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/phase06kb_test
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.167
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase06kb_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase06kb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      # Supabase owns this disposable database as supabase_admin. The fixture
      # user needs schema CREATE for baseline tables and database CREATE for pgmq.
      - name: Provision isolated fixture DDL privileges
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U supabase_admin -d phase06kb_test -v ON_ERROR_STOP=1 \
            -c 'GRANT CREATE ON DATABASE phase06kb_test TO postgres;' \
            -c 'GRANT CREATE ON SCHEMA public TO postgres;'
      - name: Verify image-aware auth bootstrap
        run: node --test tests/security/auth-bootstrap.test.js
      - run: npm run verify:06k-b
      - run: npm run test:security
      - name: Upload measured DB evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 06k-b-evidence
          path: .artifacts/06k-b/
          include-hidden-files: true
          if-no-files-found: error
