name: CI Quality Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'security/**'
      - 'hotfix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal shared packages
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Monorepo Tests
        run: npm run test

      - name: Run Bridge Automation Tests
        run: npm run test:bridge

  legacy-lint-audit:
    name: Legacy Lint Audit (Diagnostic Only)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build internal shared packages
        run: npm run build:shared

      - name: Legacy Lint (non-blocking)
        run: npm run lint || true
        continue-on-error: true
