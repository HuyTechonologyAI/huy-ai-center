name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # 1. CODE INTEGRITY, TYPECHECK & LINT
  # ============================================================================
  verify:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Lint monorepo
        run: npm run lint --if-present

  # ============================================================================
  # 2. AUTOMATED UNIT & CONTRACT TESTS
  # ============================================================================
  test:
    name: Run Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run test suites
        run: npm run test

  # ============================================================================
  # 3. BUILD ARTIFACTS
  # ============================================================================
  build:
    name: Monorepo Build Verification
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages and apps
        run: npm run build

      # SAFETY GUARD: Strict no-deploy policy in CI workflow
      - name: Verify No Deployment Action
        run: |
          echo ">>> [SAFETY GUARD] Automated production deployment is STRICTLY DISABLED in CI."
          echo ">>> All production releases require human approval and staged rollout."
